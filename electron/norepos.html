<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Git Graph</title>
	<style>
		body{ margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#1e1e1e; color:#d4d4d4; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
		.box{ text-align:center; max-width:420px; }
		h1{ font-size:20px; font-weight:600; margin:0 0 8px; }
		p{ color:#a6a6a6; margin:0 0 20px; }
		button{ background:#0e639c; color:#fff; border:0; padding:8px 18px; margin:0 4px; font-size:13px; cursor:pointer; }
		button.secondary{ background:#3a3d41; }
		button:hover{ filter:brightness(1.15); }
	</style>
</head>
<body>
	<div class="box">
		<h1>No repositories yet</h1>
		<p>Open an existing Git repository, or clone a new one to get started.</p>
		<button id="add">Open Repository...</button>
		<button id="clone" class="secondary">Clone...</button>
	</div>
	<script>
		document.getElementById('add').addEventListener('click', function () { window.electronAPI.addRepository(); });
		document.getElementById('clone').addEventListener('click', function () { window.electronAPI.cloneRepository(); });
	</script>
</body>
</html>
