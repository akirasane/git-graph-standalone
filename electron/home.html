<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Git Graph</title>
	<link rel="stylesheet" href="ui/nocturne.css">
	<script src="ui/icons.js"></script>
	<script src="ui/toast.js"></script>
	<script src="ui/titlebar.js"></script>
	<style>
		html, body { height: 100%; }
		body { overflow: hidden; font-size: 13px; }
		button, input { font: inherit; }

		#app { position: fixed; top: var(--titlebar-h, 0px); left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
		.hub-wrap { width: 100%; max-width: 1360px; margin: 0 auto; padding: 0 44px; }

		/* header */
		.hub-head { display: flex; align-items: center; gap: var(--space-6); padding-top: 10px; flex-wrap: wrap; }
		.hub-title { display: flex; align-items: baseline; gap: var(--space-6); flex: 1; min-width: 0; }
		.hub-title h2 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
		.hub-stats { color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.hub-stats b { color: var(--color-text); font-weight: 500; font-variant-numeric: tabular-nums; }
		.hub-actions { display: flex; gap: var(--space-3); }
		.hub-actions .btn { height: 30px; }

		/* toolbar */
		.hub-toolbar { display: flex; align-items: center; gap: var(--space-3); padding: 18px 0 6px; }
		.hub-search { position: relative; width: 340px; flex: 0 1 340px; }
		.hub-search > [data-icon] { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--color-muted); pointer-events: none; }
		.hub-search .input { height: 36px; padding-left: 33px; padding-right: 34px; }
		.hub-search .kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; }
		.hub-search .input:focus-visible + .kbd, .hub-search .input:not(:placeholder-shown) + .kbd { display: none; }
		.hub-toolbar .seg { height: 36px; }
		.hub-toolbar .seg-opt { padding: 0 12px; font-size: 13px; }
		.hub-toolbar .seg-opt .n { color: var(--color-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
		.hub-spacer { flex: 1; }
		#sortBtn { height: 32px; color: var(--color-muted); }
		#sortBtn:hover { color: var(--color-text); }
		#sortBtn .caret { width: 11px; height: 11px; }

		/* sections + grid */
		#scroll { flex: 1; overflow-y: auto; scrollbar-gutter: stable; }
		#scroll > .hub-wrap { padding-top: 10px; padding-bottom: 28px; }
		.hub-section { margin-top: 14px; }
		.hub-section[hidden] { display: none; }
		.hub-kicker { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; font-size: 10px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--color-muted); }
		.hub-kicker .n { letter-spacing: 0; font-size: 11px; color: var(--color-muted); font-variant-numeric: tabular-nums; }
		.hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }

		/* repo card */
		.repo { position: relative; gap: 10px; padding: 14px 14px 12px; cursor: pointer; outline: none; min-width: 0;
			box-shadow: 0 0 0 1px transparent; content-visibility: auto; contain-intrinsic-size: auto 122px;
			transition: transform 200ms var(--ease), box-shadow 200ms var(--ease); }
		.repo:hover, .repo:focus-visible, .repo.is-menu {
			transform: translateY(-2px);
			box-shadow: 0 0 0 1px var(--color-accent), 0 10px 28px -10px color-mix(in srgb, var(--color-accent) 45%, transparent);
		}
		.repo:focus-visible { box-shadow: 0 0 0 2px var(--color-accent), 0 10px 28px -10px color-mix(in srgb, var(--color-accent) 45%, transparent); }
		.repo:active { transform: translateY(-1px); }
		.repo[hidden] { display: none; }
		.repo.enter { animation: gg-rise 220ms var(--ease) both; animation-delay: calc(var(--i, 0) * 24ms); }
		.repo-head { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }
		.repo-mono { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: var(--radius-md); background: var(--color-accent-800); color: var(--color-accent-100); font-weight: 500; font-size: 14px; }
		.repo-names { flex: 1; min-width: 0; }
		.repo-name { font-size: 15px; font-weight: 500; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.repo-path { font-family: var(--font-mono, ui-monospace, Consolas, monospace); font-size: 11px; color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.repo-tools { display: flex; gap: 2px; align-self: flex-start; margin: -4px -6px 0 0; }
		.repo-tools .btn-icon { width: 28px; height: 28px; }
		.repo-tools .btn-icon svg { width: 15px; height: 15px; }
		.repo-tools .t-more, .repo-tools .t-reveal { opacity: 0; transition: opacity var(--dur) var(--ease); }
		.repo-tools .t-pin { color: var(--color-faint); }
		.repo:hover .repo-tools .btn-icon, .repo:focus-within .repo-tools .btn-icon, .repo.is-menu .repo-tools .btn-icon { opacity: 1; }
		.repo-tools .t-pin:hover { color: var(--color-text); }
		.repo.is-pinned .t-pin { opacity: 0; color: var(--color-accent); }
		.repo.is-pinned:hover .t-pin, .repo.is-pinned:focus-within .t-pin, .repo.is-pinned.is-menu .t-pin { opacity: 1; }
		.repo-tags { display: flex; flex-wrap: wrap; gap: 6px; min-height: 22px; align-items: center; }
		.repo-tags .tag { height: 22px; font-size: 11.5px; max-width: 100%; white-space: nowrap; }
		.repo-tags .tag-branch { overflow: hidden; text-overflow: ellipsis; display: inline-block; line-height: 18px; }
		.repo-tags .tag-branch [data-icon] { margin: -2px 4px 0 0; }
		.repo-tags .tag [data-icon] { width: 12px; height: 12px; }
		.repo-last { display: flex; align-items: baseline; gap: var(--space-4); min-height: 19px; font-size: 12.5px; }
		.repo-last .subject { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: color-mix(in srgb, var(--color-text) 85%, transparent); }
		.repo-last .subject.none { color: var(--color-muted); }
		.repo-last .when { flex: none; font-size: 11.5px; color: var(--color-muted); font-variant-numeric: tabular-nums; }
		.repo.is-missing .repo-mono { background: var(--color-neutral-800); color: var(--color-neutral-400); }
		.repo.is-missing .repo-name { color: var(--color-muted); }
		.repo-last .btn-sm { padding: 1px 8px; }
		.skel-line { display: inline-block; height: 10px; border-radius: 4px; }

		/* states */
		.hub-nomatch { padding: 70px 0; text-align: center; color: var(--color-muted); }
		.hub-nomatch p { margin-bottom: var(--space-4); }
		.hub-empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 56px 0 24px; animation: gg-rise 240ms var(--ease); }
		.hub-empty .mark { width: 48px; height: 48px; border-radius: 12px; margin-bottom: 18px; }
		.hub-empty .mark [data-icon] { width: 24px; height: 24px; }
		.hub-empty h2 { font-size: 24px; margin-bottom: 6px; }
		.hub-empty > p { color: var(--color-muted); max-width: 440px; margin-bottom: 28px; }
		.hub-start { display: grid; grid-template-columns: repeat(3, 210px); gap: 12px; }
		.hub-start .card { align-items: flex-start; text-align: left; gap: 10px; padding: 16px; cursor: pointer; border: 0; font: inherit; color: inherit; box-shadow: 0 0 0 1px transparent; transition: transform 200ms var(--ease), box-shadow 200ms var(--ease); }
		.hub-start .card:hover, .hub-start .card:focus-visible { transform: translateY(-2px); box-shadow: 0 0 0 1px var(--color-accent), 0 10px 28px -10px color-mix(in srgb, var(--color-accent) 45%, transparent); outline: none; }
		.hub-start .card-title { font-size: 14px; }
		.hub-start .card-body { font-size: 12px; color: var(--color-muted); opacity: 1; }
		.hub-foot { flex: none; display: flex; justify-content: center; align-items: center; gap: 6px; padding: 10px 0 14px; font-size: 12px; color: var(--color-muted); }
		.hub-foot [data-icon] { width: 13px; height: 13px; }

		/* drag & drop */
		#drop { position: fixed; inset: calc(var(--titlebar-h, 0px) + 10px) 12px 12px; z-index: 300; display: none; place-items: center; text-align: center; pointer-events: none;
			border-radius: var(--radius-lg); border: 1.5px dashed var(--color-accent); background: color-mix(in srgb, var(--color-bg) 90%, transparent);
			box-shadow: inset 0 0 60px -20px color-mix(in srgb, var(--color-accent) 40%, transparent); animation: gg-fade 140ms ease; }
		#drop.show { display: grid; }
		#drop .gg-glyph { margin: 0 auto 14px; width: 44px; height: 44px; }
		#drop .gg-glyph [data-icon] { width: 22px; height: 22px; }
		#drop b { display: block; font-size: 16px; font-weight: 500; }
		#drop span { color: var(--color-muted); }

		/* dialogs */
		.dialog { width: min(480px, 100%); }
		.dialog .field + .field { margin-top: var(--space-2); }
		.dialog-sub { margin: -4px 0 4px; font-size: 12.5px; color: var(--color-muted); }
		.pick { display: flex; gap: var(--space-2); }
		.pick .input { flex: 1; min-width: 0; }
		.recent-dirs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
		.recent-dirs button { border: 1px solid var(--color-divider); background: transparent; color: var(--color-muted); border-radius: var(--radius-sm); font-size: 11.5px; padding: 1px 7px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.recent-dirs button:hover { color: var(--color-text); border-color: color-mix(in srgb, var(--color-text) 40%, transparent); }
		.clone-progress { display: flex; flex-direction: column; gap: 6px; }
		.clone-progress[hidden] { display: none; }
		.clone-progress .meta { display: flex; justify-content: space-between; gap: var(--space-4); font-size: 12px; color: var(--color-muted); font-variant-numeric: tabular-nums; }
		.clone-progress .meta b { color: var(--color-text); font-weight: 500; }
		.dialog-error { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--color-danger-bg); color: var(--color-danger); font-size: 12.5px; white-space: pre-line; overflow-wrap: anywhere; max-height: 120px; overflow-y: auto; }
		.dialog-error[hidden] { display: none; }
		.dialog-error [data-icon] { margin-top: 1px; }

		/* undo toast */
		.gg-toast .toast-action { margin: -3px -6px -3px var(--space-2); }

		@media (max-width: 900px) {
			.hub-wrap { padding: 0 20px; }
			.hub-actions .lbl { display: none; }
			.hub-start { grid-template-columns: 1fr; width: min(340px, 100%); }
			.hub-search { flex: 1 1 200px; }
		}
	</style>
</head>
<body>
	<div id="app">
		<div class="hub-wrap">
			<header class="hub-head">
				<div class="hub-title">
					<h2>Repositories</h2>
					<span class="hub-stats" id="stats" aria-live="polite"></span>
				</div>
				<div class="hub-actions">
					<button class="btn btn-secondary" id="btnOpen" title="Add a repository that is already on disk"><i data-icon="folder-open"></i><span class="lbl">Open</span></button>
					<button class="btn btn-secondary" id="btnScan" title="Find every repository inside a folder"><i data-icon="magnifying-glass"></i><span class="lbl">Scan folder</span></button>
					<button class="btn btn-secondary" id="btnNew" title="Create a new repository"><i data-icon="plus"></i><span class="lbl">New</span></button>
					<button class="btn btn-primary" id="btnClone" title="Clone a repository from a URL"><i data-icon="download-simple"></i><span class="lbl">Clone</span></button>
				</div>
			</header>
			<div class="hub-toolbar" id="toolbar">
				<label class="hub-search">
					<i data-icon="magnifying-glass"></i>
					<input class="input" id="search" type="text" placeholder="Search repositories" autocomplete="off" spellcheck="false" aria-label="Search repositories">
					<span class="kbd">/</span>
				</label>
				<div class="seg" id="filters" role="radiogroup" aria-label="Filter">
					<label class="seg-opt"><input type="radio" name="f" value="all" checked>All</label>
					<label class="seg-opt"><input type="radio" name="f" value="pinned">Pinned</label>
					<label class="seg-opt"><input type="radio" name="f" value="changes">Changes</label>
					<label class="seg-opt"><input type="radio" name="f" value="behind">Behind</label>
				</div>
				<span class="hub-spacer"></span>
				<button class="btn btn-secondary btn-sm" id="sortBtn" aria-haspopup="menu" aria-expanded="false" title="Sort"><i data-icon="sort-ascending"></i><span id="sortLabel">Recent</span><i data-icon="caret-down" class="caret"></i></button>
			</div>
		</div>

		<div id="scroll">
			<div class="hub-wrap">
				<section class="hub-section" id="secPinned" hidden>
					<h3 class="hub-kicker">Pinned <span class="n"></span></h3>
					<div class="hub-grid" role="list"></div>
				</section>
				<section class="hub-section" id="secRecent" hidden>
					<h3 class="hub-kicker"><span class="lbl">Recent</span> <span class="n"></span></h3>
					<div class="hub-grid" role="list"></div>
				</section>
				<div class="hub-nomatch" id="nomatch" hidden>
					<p id="nomatchText">No repositories match.</p>
					<button class="btn btn-secondary btn-sm" id="clearFilters">Clear search and filters</button>
				</div>
				<section class="hub-empty" id="empty" hidden>
					<span class="gg-titlebar-mark mark"><i data-icon="git-branch"></i></span>
					<h2>Welcome to Git Graph</h2>
					<p>Add a repository to see its commit graph, stage and commit changes, and resolve conflicts - all in one place.</p>
					<div class="hub-start">
						<button class="card" id="startClone"><span class="gg-glyph"><i data-icon="download-simple"></i></span><span class="card-title">Clone</span><span class="card-body">From GitHub, GitLab or any Git URL</span></button>
						<button class="card" id="startOpen"><span class="gg-glyph"><i data-icon="folder-open"></i></span><span class="card-title">Open</span><span class="card-body">A repository that is already on disk</span></button>
						<button class="card" id="startNew"><span class="gg-glyph"><i data-icon="folder-plus"></i></span><span class="card-title">New</span><span class="card-body">Start a fresh, empty repository</span></button>
					</div>
				</section>
			</div>
		</div>

		<footer class="hub-foot" id="foot"><i data-icon="folder-plus"></i>Drop a folder anywhere to add it &middot; <span class="kbd">/</span> search</footer>
	</div>

	<div id="drop" aria-hidden="true"><div><span class="gg-glyph"><i data-icon="folder-plus"></i></span><b>Drop to add</b><span>Repositories inside the folder are found automatically</span></div></div>

	<script src="home.js"></script>
</body>
</html>
