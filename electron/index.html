<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Git Graph</title>
	<!-- Nocturne first (tokens + components), then the graph renderer's own styles, then the shell layout below. -->
	<link rel="stylesheet" href="ui/nocturne.css">
	<link rel="stylesheet" type="text/css" href="../media/out.min.css">
	<style>
		/*
		 * Graph shell (Nocturne): left sidebar, centre graph (#view, rendered by media/out.min.js),
		 * right Working copy / Stash panel (or the docked commit details #cdv.docked in the same box),
		 * and the full-window conflict editor. Tokens only - see design/README.md.
		 * The top var(--titlebar-h, 0px) is reserved for the custom window title bar.
		 */
		:root{
			--sb-w: 248px;
			--rp-w: 318px;
			--shell-top: var(--titlebar-h, 0px);
			--panel-bg: color-mix(in srgb, var(--color-bg) 82%, black);
			--rule: color-mix(in srgb, var(--color-text) 8%, transparent);
			--row-h: 28px;
		}
		@media (max-width: 1180px){ :root{ --sb-w: 220px; --rp-w: 288px; } }
		@media (max-width: 1024px){ :root{ --sb-w: 208px; --rp-w: 272px; } }

		/* The graph renderer is written against Nocturne tokens. */
		body{
			--git-graph-color0:#9184d9; --git-graph-color1:#6fb5c9; --git-graph-color2:#c79a6a; --git-graph-color3:#7fc79b; --git-graph-color4:#d98fa6; --git-graph-color5:#a8b86a;
			--git-graph-color6:#7a9fe0; --git-graph-color7:#c98ad9; --git-graph-color8:#6fc9b0; --git-graph-color9:#d9a06f; --git-graph-color10:#9aa0b8;


			font-size: 13px;
			color: var(--color-text);
			font-family: var(--font-body);
			background-color: var(--color-bg);
		}
		#view{ color: var(--color-text); font-family: var(--font-body); background-color: var(--color-bg); }
		[data-color="0"]{--git-graph-color:var(--git-graph-color0);} [data-color="1"]{--git-graph-color:var(--git-graph-color1);} [data-color="2"]{--git-graph-color:var(--git-graph-color2);} [data-color="3"]{--git-graph-color:var(--git-graph-color3);} [data-color="4"]{--git-graph-color:var(--git-graph-color4);} [data-color="5"]{--git-graph-color:var(--git-graph-color5);} [data-color="6"]{--git-graph-color:var(--git-graph-color6);} [data-color="7"]{--git-graph-color:var(--git-graph-color7);} [data-color="8"]{--git-graph-color:var(--git-graph-color8);} [data-color="9"]{--git-graph-color:var(--git-graph-color9);} [data-color="10"]{--git-graph-color:var(--git-graph-color10);}
		[hidden]{ display: none !important; }

		/* ---------- page frame ---------- */
		#view{
			top: var(--shell-top) !important;
			left: var(--sb-w) !important;
			right: var(--rp-w) !important;
			bottom: 0 !important;
		}

		/* Shared shell primitives */
		.shIconBtn{
			display: inline-grid; place-items: center; width: 24px; height: 24px; padding: 0; flex: none; cursor: pointer;
			border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--color-muted);
			transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
		}
		.shIconBtn [data-icon]{ width: 15px; height: 15px; }
		.shIconBtn:hover{ background: var(--color-hover); color: var(--color-text); }
		.shIconBtn:active{ background: var(--color-pressed); }
		.shIconBtn.danger:hover{ color: var(--color-danger); background: var(--color-danger-bg); }
		.shIconBtn:disabled{ opacity: .45; pointer-events: none; }
		.shKicker{ font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-muted); font-weight: 600; }
		.shLink{
			border: 0; background: transparent; padding: 2px 6px; margin-right: -6px; border-radius: var(--radius-sm); cursor: pointer;
			font: inherit; font-size: 12px; color: var(--color-accent); white-space: nowrap;
		}
		.shLink:hover{ background: var(--color-accent-hover); }
		.shLink.danger{ color: var(--color-danger); }
		.shLink.danger:hover{ background: var(--color-danger-bg); }
		.shLink:disabled{ opacity: .45; pointer-events: none; }
		.shEmpty{ display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px 16px; text-align: center; color: var(--color-muted); font-size: 12.5px; }
		.shEmpty [data-icon]{ width: 22px; height: 22px; color: var(--color-faint); }
		.shEmpty b{ font-weight: 500; color: var(--color-text); font-size: 13px; }
		.shSkel{ display: flex; flex-direction: column; gap: 10px; padding: 8px 14px; }
		.shSkel .skeleton{ height: 10px; }
		.shSkel .skeleton:nth-child(2n){ width: 70%; } .shSkel .skeleton:nth-child(3n){ width: 82%; }
		.shPath{ display: flex; min-width: 0; flex: 1; white-space: nowrap; }
		.shPath .dir{ color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
		.shPath .base{ overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }

		/* ---------- left sidebar (sidebar.js) ---------- */
		#sidebar{
			position: fixed; left: 0; top: var(--shell-top); bottom: 0; width: var(--sb-w); z-index: 5;
			display: flex; flex-direction: column; overflow: hidden;
			background: var(--panel-bg); border-right: 1px solid var(--rule); font-size: 13px;
		}
		#sbHome{
			display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; height: 30px; margin: 10px 8px 2px; padding: 0 8px;
			border: 0; border-radius: var(--radius-md); background: transparent; color: var(--color-muted); font: inherit; font-size: 13px; cursor: pointer;
			transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
		}
		#sbHome [data-icon]{ width: 15px; height: 15px; transition: transform var(--dur) var(--ease); }
		#sbHome:hover{ color: var(--color-text); background: var(--color-hover); }
		#sbHome:hover [data-icon]{ transform: translateX(-2px); }
		#sbSync{ padding: 2px 10px 10px; flex: none; }
		#sbBranchLine{ display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px; min-width: 0; font-size: 13px; }
		#sbBranchLine [data-icon]{ width: 14px; height: 14px; color: var(--color-muted); }
		#sbBranchLine .sbBl-branch{ font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; min-width: 0; }
		#sbBranchLine .sbBl-arrow{ width: 12px; height: 12px; color: var(--color-faint); }
		#sbBranchLine .sbBl-up{ color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 0; min-width: 0; }
		#sbBranchLine.unpublished .sbBl-up{ color: var(--color-warning); }
		#sbBranchLine.detached .sbBl-branch{ color: var(--color-warning); }
		#sbBranchLine.noUpstream .sbBl-arrow{ display: none; }
		.sbSyncBtns{ display: flex; gap: 5px; margin-top: 6px; }
		.sbSyncBtn{ flex: 1 1 auto; height: 30px; padding: 0 5px; gap: 4px; font-size: 12px; min-width: 0; }
		.sbSyncBtn > span{ overflow: hidden; text-overflow: ellipsis; }
		.sbSyncBtn [data-icon]{ width: 13px; height: 13px; }
		@media (max-width: 1180px){ .sbSyncBtn:not(.busy) [data-icon]{ display: none; } }
		.sbSyncBtn.hot{ color: var(--color-accent); border-color: var(--color-accent); }
		.sbSyncBtn.hot:hover{ background: var(--color-accent-hover); }
		.sbSyncBtn.busy [data-icon]{ animation: gg-spin .8s linear infinite; }
		.sbBadge{
			min-width: 16px; height: 16px; padding: 0 3px; border-radius: 999px; border: 1px solid currentColor;
			font-size: 10px; line-height: 14px; font-weight: 500; text-align: center; font-variant-numeric: tabular-nums;
		}
		#sbTop{ position: relative; padding: 0 10px 8px; flex: none; }
		#sbTop [data-icon]{ position: absolute; left: 21px; top: 9px; width: 14px; height: 14px; color: var(--color-faint); pointer-events: none; }
		#sbFilter{ padding-left: 32px; height: 32px; }
		#sbFilter::-webkit-search-cancel-button{ filter: invert(.6); cursor: pointer; }
		#sbScroll{ flex: 1; overflow-y: auto; min-height: 0; padding-bottom: 12px; }
		.sbHeader{
			display: flex; align-items: center; gap: 6px; width: 100%; height: 30px; margin-top: 4px; padding: 0 14px 0 12px;
			border: 0; background: transparent; cursor: pointer; text-align: left; font: inherit;
		}
		.sbHeader .shKicker{ transition: color var(--dur) var(--ease); }
		.sbHeader:hover .shKicker{ color: var(--color-text); }
		.sbCaret{ width: 11px; height: 11px; color: var(--color-muted); transition: transform var(--dur) var(--ease); }
		.sbHeader[aria-expanded="false"] .sbCaret{ transform: rotate(-90deg); }
		.sbCount{ margin-left: auto; font-size: 11px; color: var(--color-muted); font-variant-numeric: tabular-nums; }
		.sbList{ list-style: none; margin: 0; padding: 0; }
		.sbRow{
			position: relative; display: flex; align-items: center; gap: 6px; height: var(--row-h); margin: 0 6px; padding: 0 6px 0 22px;
			border-radius: var(--radius-md); cursor: default; transition: background var(--dur) var(--ease);
		}
		.sbRow:hover{ background: var(--color-hover); }
		.sbRow:focus-visible{ outline-offset: -2px; }
		.sbRow.sbCurrent{ background: color-mix(in srgb, var(--color-accent) 10%, transparent); box-shadow: inset 2px 0 0 var(--color-accent); }
		.sbRow.sbCurrent::before{ content: ""; position: absolute; left: 10px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--color-accent); }
		.sbRow.sbCurrent .sbLabel{ font-weight: 500; }
		.sbLabel{ flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.sbSub{ color: var(--color-faint); font-size: 11px; flex: none; }
		.sbActions{ display: none; gap: 1px; flex: none; margin-right: -2px; }
		.sbRow:hover .sbActions, .sbRow:focus-within .sbActions{ display: flex; }
		.sbRow:hover .sbSub, .sbRow:focus-within .sbSub{ display: none; }
		.sbBtn{ width: 22px; height: 22px; }
		.sbBtn [data-icon]{ width: 14px; height: 14px; }
		.sbRemoteName{ display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 12px 0 20px; font-size: 12px; color: var(--color-muted); }
		.sbRemoteName [data-icon]{ width: 13px; height: 13px; color: var(--color-faint); }
		.sbRemoteName ~ .sbRow{ padding-left: 28px; }
		.sbEmpty{ padding: 4px 28px 6px; font-size: 12px; color: var(--color-muted); }
		.sbMore{ display: block; margin: 2px 6px 0 22px; }
		.sbSkel{ padding: 10px 18px; }

		/* conflict banner (conflicts.js renders into #sbConflicts) */
		#sbConflicts{
			flex: none; max-height: 40%; overflow-y: auto; margin: 0 10px 10px; padding: 10px 10px 10px 12px;
			border-radius: var(--radius-md); background: var(--color-warning-bg);
			box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--color-warning) 40%, transparent); animation: gg-rise 220ms var(--ease);
		}
		.cfTitle{ display: flex; align-items: center; gap: 6px; font-weight: 500; color: var(--color-warning); }
		.cfTitle [data-icon]{ width: 15px; height: 15px; }
		.cfSub{ margin: 2px 0 6px; font-size: 12px; color: var(--color-muted); }
		.cfList{ list-style: none; margin: 0 -4px 8px; padding: 0; }
		.cfFile{
			display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px; border-radius: var(--radius-sm); cursor: pointer; font-size: 12.5px;
		}
		.cfFile [data-icon]{ width: 13px; height: 13px; color: var(--color-warning); }
		.cfFile:hover{ background: var(--color-hover); }
		.cfButtons{ display: flex; flex-wrap: wrap; gap: 6px; }
		.cfButtons .btn{ height: 26px; }
		.cfMessage{ color: var(--color-danger); font-size: 12px; margin-top: 6px; }
		.cfMessage:empty{ display: none; }

		/* ---------- right panel: Working copy / Stash (panel.js) ---------- */
		#wcPanel{
			position: fixed; right: 0; top: var(--shell-top); bottom: 0; width: var(--rp-w); z-index: 5;
			display: flex; flex-direction: column; overflow: hidden; font-size: 13px;
			background: var(--panel-bg); border-left: 1px solid var(--rule);
		}
		.wcTabs{ display: flex; gap: 2px; padding: 8px 10px 0; flex: none; box-shadow: inset 0 -1px 0 var(--rule); }
		.wcTab{
			display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; cursor: pointer;
			border: 0; border-bottom: 2px solid transparent; border-radius: var(--radius-sm) var(--radius-sm) 0 0; background: transparent;
			font: inherit; font-size: 13px; font-weight: 500; color: var(--color-muted);
			transition: color var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease);
		}
		.wcTab:hover{ color: var(--color-text); background: var(--color-hover); }
		.wcTab:focus-visible{ outline-offset: -2px; }
		.wcTab.active{ color: var(--color-text); border-bottom-color: var(--color-accent); }
		.wcTabCount{ font-size: 11px; font-weight: 400; color: var(--color-muted); font-variant-numeric: tabular-nums; }
		.wcTabCount:empty{ display: none; }
		.wcTabContent{ flex: 1; display: flex; flex-direction: column; min-height: 0; }
		.wcLists{ flex: 1; overflow-y: auto; min-height: 0; padding: 4px 0 8px; }
		.wcSection{ padding-bottom: 4px; }
		.wcSectionHeader{ display: flex; justify-content: space-between; align-items: center; gap: 8px; height: 30px; padding: 0 14px; margin-top: 4px; }
		.wcSectionHeader > span:last-child{ display: flex; gap: 4px; }
		.wcFileList{ list-style: none; margin: 0; padding: 0; }
		.wcFileRow{
			display: flex; align-items: center; gap: 8px; height: var(--row-h); margin: 0 6px; padding: 0 6px 0 8px; border-radius: var(--radius-md);
			cursor: pointer; transition: background var(--dur) var(--ease);
		}
		.wcFileRow:hover{ background: var(--color-hover); }
		.wcFileRow:focus-visible{ outline-offset: -2px; }
		.wcStatus{ width: 12px; flex: none; font-size: 11.5px; font-weight: 600; text-align: center; }
		.wcStatus.s-M{ color: var(--color-warning); } .wcStatus.s-A, .wcStatus.s-U{ color: var(--color-success); }
		.wcStatus.s-D{ color: var(--color-danger); } .wcStatus.s-R{ color: var(--color-info); }
		.wcFileStats{ flex: none; font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
		.wcAdd{ color: var(--color-success); } .wcDel{ color: var(--color-danger); margin-left: 5px; }
		.wcFileActions{ display: none; gap: 1px; flex: none; margin-right: -2px; }
		.wcFileRow:hover .wcFileActions, .wcFileRow:focus-within .wcFileActions{ display: flex; }
		.wcFileRow:hover .wcFileStats, .wcFileRow:focus-within .wcFileStats{ display: none; }
		.wcFileAction{ width: 22px; height: 22px; }
		.wcFileAction [data-icon]{ width: 14px; height: 14px; }
		.wcEmpty{ padding: 2px 22px 6px; font-size: 12px; color: var(--color-muted); }
		.wcCommitSection{ flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px; box-shadow: inset 0 1px 0 var(--rule); }
		.wcSummaryRow{ display: flex; gap: 6px; }
		.wcSummaryRow .input{ flex: 1; min-width: 0; }
		.wcAiBtn{ width: 32px; height: 32px; padding: 0; flex: none; }
		.wcAiBtn [data-icon]{ width: 16px; height: 16px; }
		.wcAiBtn.busy{ pointer-events: none; }
		.wcAiBtn.busy [data-icon]{ animation: gg-spin .8s linear infinite; }
		#wcDescriptionInput{ min-height: 58px; height: 58px; max-height: 40vh; }
		.wcCommitSection .input[readonly]{ color: var(--color-muted); }
		.wcChecks{ display: flex; flex-direction: column; gap: 6px; padding: 2px 0; }
		.wcChecks .check{ font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 85%, transparent); }
		.wcCommitBtn{ height: 32px; }
		.wcCommitBtn [data-icon]{ width: 15px; height: 15px; }
		.wcStashRow{
			display: flex; align-items: center; gap: 10px; min-height: 40px; margin: 0 6px; padding: 4px 6px 4px 10px; border-radius: var(--radius-md);
			transition: background var(--dur) var(--ease);
		}
		.wcStashRow:hover{ background: var(--color-hover); }
		.wcStashRow > [data-icon]{ width: 15px; height: 15px; color: var(--color-muted); }
		.wcStashText{ flex: 1; min-width: 0; display: flex; flex-direction: column; }
		.wcStashMessage, .wcStashMeta{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.wcStashMeta{ font-size: 11.5px; color: var(--color-muted); }
		.wcStashActions{ display: none; gap: 1px; flex: none; }
		.wcStashRow:hover .wcStashActions, .wcStashRow:focus-within .wcStashActions{ display: flex; }

		/* ---------- commit details docked in the right column (#cdv is rendered by out.min.js) ---------- */
		#cdv.docked{
			left: auto !important; right: 0; top: var(--shell-top); bottom: 0; width: var(--rp-w); height: auto !important;
			background: var(--panel-bg); border-left: 1px solid var(--rule); z-index: 6;
		}
		#cdv.docked .cdvHeightResize, #cdv.docked #cdvDivider{ display: none !important; }
		#cdv.docked #cdvSummary{
			top: 0 !important; left: 0 !important; right: 0 !important; width: auto !important; bottom: auto !important; height: 42% !important;
			border-right: none !important; box-shadow: inset 0 -1px 0 var(--rule); overflow-y: auto;
		}
		#cdv.docked #cdvFiles{
			top: 42% !important; left: 0 !important; right: 0 !important; width: auto !important; bottom: 0 !important; border-right: none !important;
		}

		/* ---------- conflict editor overlay (conflicts.js) ---------- */
		#cfOverlay{
			position: fixed; left: 0; right: 0; bottom: 0; top: var(--shell-top); z-index: 50; display: none; flex-direction: column;
			background: var(--color-bg); animation: gg-fade var(--dur) ease;
		}
		#cfBar{ display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 12px 0 16px; flex: none; box-shadow: inset 0 -1px 0 var(--rule); background: var(--panel-bg); }
		#cfBar > [data-icon]{ width: 16px; height: 16px; color: var(--color-warning); }
		#cfEditorTitle{ font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
		#cfEditorTitle .dir{ color: var(--color-muted); font-weight: 400; }
		#cfStatus{ flex: none; }
		#cfStatus:empty{ display: none; }
		.cfSpacer{ flex: 1; }
		.cfWhole{ display: flex; align-items: center; gap: 6px; flex: none; }
		.cfWhole > span{ font-size: 12px; color: var(--color-muted); }
		#cfBar .btn{ height: 30px; }
		#cfEditorBody{ flex: 1; display: flex; flex-direction: column; min-height: 0; }
		.cfHunks{ flex: 0 1 auto; max-height: 62%; overflow-y: auto; padding: 14px 16px 6px; min-height: 0; }
		.cfNote{ padding: 16px; color: var(--color-muted); }
		.cfErr{ color: var(--color-danger); }
		.cfHunk{ margin-bottom: 12px; border-radius: var(--radius-md); background: var(--color-surface); box-shadow: var(--shadow-sm); overflow: hidden; }
		.cfHunk.cfOpen{ box-shadow: 0 0 0 1px color-mix(in srgb, var(--color-warning) 55%, transparent); }
		.cfHunkHead{ display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 8px 10px 8px 12px; }
		.cfHunkHead > b{ font-weight: 500; }
		.cfHunkHead .seg{ margin-left: auto; }
		.cfHunkHead .seg-opt{ padding: 4px 10px; }
		.cfPanes{ display: flex; box-shadow: inset 0 1px 0 var(--rule); }
		.cfPane{ flex: 1; min-width: 0; }
		.cfPane + .cfPane{ box-shadow: inset 1px 0 0 var(--rule); }
		.cfPaneTitle{ display: flex; align-items: center; gap: 6px; padding: 6px 12px; }
		.cfPaneTitle::before{ content: ""; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--color-muted); flex: none; }
		.cfOurs .cfPaneTitle::before{ border-color: var(--color-accent); }
		.cfTheirs .cfPaneTitle::before{ border-color: var(--color-success); }
		.cfPane pre{
			margin: 0; padding: 8px 12px 10px; background: var(--color-sunken); font-family: var(--font-mono); font-size: 12px; line-height: 1.55;
			overflow-x: auto; white-space: pre; max-height: 260px; overflow-y: auto;
		}
		.cfOurs pre{ box-shadow: inset 2px 0 0 var(--color-accent); }
		.cfTheirs pre{ box-shadow: inset 2px 0 0 var(--color-success); }
		.cfPane pre i{ color: var(--color-faint); }
		.cfOutputWrap{ flex: 1; display: flex; flex-direction: column; min-height: 140px; padding: 8px 16px 16px; box-shadow: inset 0 1px 0 var(--rule); }
		.cfOutputWrap > .shKicker{ padding: 4px 0 8px; }
		#cfOutput{
			flex: 1; resize: none; padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid var(--color-divider);
			background: var(--color-sunken); color: var(--color-text); caret-color: var(--color-accent);
			font-family: var(--font-mono); font-size: 12px; line-height: 1.55; white-space: pre; overflow: auto;
		}
		#cfOutput:focus-visible{ outline: 0; border-color: var(--color-accent); box-shadow: 0 0 0 1px var(--color-accent); }

		/* ---------- themed confirm (GG.confirm below) - .dialog from nocturne.css, neutralising the graph renderer's own .dialog rule ---------- */
		.gg-confirm .dialog{
			position: static; left: auto; transform: none; z-index: auto; border: 0; text-align: left; line-height: 1.5; font-weight: 400; color: var(--color-text);
			background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
		}

	<script>
		// Themed replacement for window.confirm(): GG.confirm({ title, message, confirm, danger }) -> Promise<boolean>.
		// Enter confirms (the confirm button has focus), Esc / backdrop click cancels.
		(function () {
			'use strict';
			var GG = window.GG = window.GG || {};
			GG.confirm = function (opts) {
				opts = typeof opts === 'string' ? { message: opts } : (opts || {});
				return new Promise(function (resolve) {
					var prev = document.activeElement;
					var back = document.createElement('div');
					back.className = 'dialog-backdrop gg-confirm';
					back.innerHTML = '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="ggConfirmTitle" aria-describedby="ggConfirmBody">' +
						'<h2 class="dialog-title" id="ggConfirmTitle"></h2><div class="dialog-body" id="ggConfirmBody"></div>' +
						'<div class="dialog-actions"><button type="button" class="btn btn-secondary" data-r="0"></button><button type="button" class="btn" data-r="1"></button></div></div>';
					back.querySelector('.dialog-title').textContent = opts.title || 'Are you sure?';
					var body = back.querySelector('.dialog-body');
					if (opts.message) body.textContent = opts.message; else body.remove();
					var cancel = back.querySelector('[data-r="0"]'), ok = back.querySelector('[data-r="1"]');
					cancel.textContent = opts.cancel || 'Cancel';
					ok.textContent = opts.confirm || 'OK';
					ok.classList.add(opts.danger ? 'btn-danger' : 'btn-primary');
					function done(v) {
						document.removeEventListener('keydown', onKey, true);
						back.remove();
						if (prev && prev.focus) prev.focus();
						resolve(v);
					}
					function onKey(e) {
						if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); }
						else if (e.key === 'Tab') { e.preventDefault(); (document.activeElement === ok ? cancel : ok).focus(); }
					}
					back.addEventListener('mousedown', function (e) { if (e.target === back) done(false); });
					cancel.addEventListener('click', function () { done(false); });
					ok.addEventListener('click', function () { done(true); });
					document.addEventListener('keydown', onKey, true);
					document.body.appendChild(back);
					ok.focus();
				});
			};
		})();
	</script>
