name: Release

# Every push to develop: read the version from electron/package.json; if release v<version> does not
# exist yet, build the Windows installer and publish a GitHub Release (this also creates the tag).
# Same version again = nothing happens.
# To ship a new version: bump "version" in electron/package.json (and package-lock.json) and push.
# Manual run (Actions -> Release -> Run workflow) builds the installer as an artifact only, no release.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          VER="$(node -p "require('./electron/package.json').version")"
          if ! printf '%s' "$VER" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "version '$VER' is not valid semver" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$EVENT" = "push" ]; then
            if gh release view "v$VER" --repo "$REPO" >/dev/null 2>&1; then
              echo "release v$VER already exists"
            elif [ -n "$(git ls-remote --tags origin "refs/tags/v$VER")" ]; then
              echo "tag v$VER already exists without a release" >&2
              exit 1
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Builds media/out.min.js + out.min.css from web/*.ts, which electron/index.html loads as
      # a sibling folder outside electron/ itself (electron-builder's extraResources config
      # bundles this into the packaged app - see electron/package.json).
      - name: Install electron dependencies
        working-directory: electron
        run: npm ci

      - name: Install root dependencies
        run: npm ci

      - name: Build main process + web assets
        run: npm run compile

      # Build only - explicitly `--publish never`. electron-builder's own GitHub publisher raced
      # itself creating the release when uploading multiple artifacts (installer + blockmap) at
      # once, silently dropping the large .exe upload while the release still reported success.
      # `never` is required, not just omitting --publish: electron-builder auto-detects "CI + git
      # tag checkout" and implicitly tries to publish anyway. The build.publish config in
      # package.json is still needed independently - it's what bakes app-update.yml into the
      # packaged app, which is how electron-updater knows which GitHub repo to check at runtime.
      - name: Build
        working-directory: electron
        run: npm run dist -- --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-graph-installer
          path: |
            electron/release/*.exe
            electron/release/*.exe.blockmap
            electron/release/latest.yml

      - name: Publish release
        if: needs.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            electron/release/*.exe
            electron/release/*.exe.blockmap
            electron/release/latest.yml
