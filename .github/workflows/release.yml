name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Builds media/out.min.js + out.min.css from web/*.ts, which electron/index.html loads as
      # a sibling folder outside electron/ itself (electron-builder's extraResources config
      # bundles this into the packaged app - see electron/package.json).
      - name: Install root dependencies
        run: npm ci

      - name: Build web assets
        run: npm run compile

      - name: Install electron dependencies
        working-directory: electron
        run: npm ci

      # The pushed tag is the single source of truth for the release version - nobody has to
      # remember to bump electron/package.json by hand before tagging.
      - name: Set package version from tag
        working-directory: electron
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      # Build only - no --publish here. electron-builder's own GitHub publisher raced itself
      # creating the release when uploading multiple artifacts (installer + blockmap) at once,
      # silently dropping the large .exe upload while the release still reported success. The
      # build.publish config in package.json is still needed independently of this - it's what
      # bakes app-update.yml into the packaged app, which is how electron-updater knows which
      # GitHub repo to check for updates against at runtime.
      - name: Build
        working-directory: electron
        run: npm run dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            electron/release/*.exe
            electron/release/*.exe.blockmap
            electron/release/latest.yml
